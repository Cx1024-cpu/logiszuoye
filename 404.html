<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>页面不存在 · LogicSim</title>
    <!-- Intentionally self-contained: GitHub Pages serves this file for missing paths at
         any depth, where relative asset URLs would resolve incorrectly. No external
         stylesheet or script is referenced here. -->
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f1f5f9;
            color: #1e293b;
            font-family: 'TsangerYuYangT03', ui-sans-serif, system-ui, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
        }

        .code {
            margin: 0;
            font-size: 48px;
            font-weight: 700;
            color: #cbd5e1;
        }

        h1 {
            margin: 16px 0 0;
            font-size: 18px;
        }

        p {
            margin: 8px 0 0;
            font-size: 14px;
            color: #475569;
        }

        a {
            display: inline-block;
            margin-top: 24px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            background: #fbbf24;
            border-radius: 8px;
            text-decoration: none;
        }

        a:hover {
            background: #f97316;
        }
    </style>
</head>

<body>
    <div class="card">
        <p class="code">404</p>
        <h1>页面不存在</h1>
        <p>你访问的地址没有对应的页面。</p>
        <!-- relative link: resolves against the site root for the paths Pages serves here -->
        <a href="./">返回 LogicSim</a>
    </div>
</body>

</html>
